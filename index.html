<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多專案甘特圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F1;
    --panel:#FFFFFF;
    --border:#DEE3D8;
    --border-soft:#EAEEE5;
    --ink:#20281E;
    --ink-soft:#5B665A;
    --ink-faint:#8B9587;
    --accent:#2F6F4E;
    --accent-dark:#22523A;
    --accent-soft:#E6F0E8;
    --amber:#C97E33;
    --amber-soft:#F6E9D8;
    --danger:#AE4A32;
    --danger-soft:#F5E4DE;
    --weekend:#EFF2EA;
    --radius-sm:6px;
    --radius-md:10px;
    --shadow:0 1px 2px rgba(32,40,30,0.06), 0 4px 14px rgba(32,40,30,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size:14px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    margin:0;
    color:var(--ink);
  }
  button{font-family:inherit;font-size:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  #app{
    display:flex;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:250px;
    flex:none;
    background:var(--panel);
    border-right:1px solid var(--border);
    padding:22px 16px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .sidebar-title{
    font-size:19px;
    letter-spacing:0.01em;
  }
  .sidebar-sub{
    color:var(--ink-faint);
    font-size:12.5px;
    margin-top:2px;
  }
  .project-list{
    list-style:none;
    margin:0;padding:0;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .project-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    border-left:3px solid transparent;
    color:var(--ink-soft);
  }
  .project-item:hover{background:var(--border-soft);}
  .project-item.active{
    background:var(--accent-soft);
    border-left-color:var(--accent);
    color:var(--ink);
    font-weight:600;
  }
  .project-dot{
    width:9px;height:9px;border-radius:50%;flex:none;
  }
  .project-name{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .add-project-btn{
    margin-top:4px;
    background:transparent;
    border:1px dashed var(--border);
    color:var(--ink-soft);
    padding:9px 10px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    text-align:left;
    transition:border-color .15s, color .15s;
  }
  .add-project-btn:hover{border-color:var(--accent); color:var(--accent-dark);}

  .sidebar-help{
    margin-top:auto;
    padding-top:16px;
    border-top:1px solid var(--border-soft);
    color:var(--ink-faint);
    font-size:12px;
    line-height:1.7;
  }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    min-width:0;
    padding:28px 34px 60px;
  }
  .main-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    margin-bottom:22px;
  }
  .main-header-left{display:flex; align-items:center; gap:12px;}
  .main-dot{width:14px;height:14px;border-radius:50%;flex:none;margin-top:6px;}
  .main-title{font-size:24px;}
  .main-meta{color:var(--ink-faint); font-size:12.5px; margin-top:4px;}
  .header-actions{display:flex; gap:8px; flex:none;}
  .btn{
    border-radius:var(--radius-sm);
    padding:9px 14px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--ink-soft);
    cursor:pointer;
    font-weight:500;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--ink-faint); color:var(--ink);}
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .btn-primary:hover{background:var(--accent-dark); border-color:var(--accent-dark); color:#fff;}
  .btn-text{
    border:none;
    background:none;
    color:var(--ink-faint);
    cursor:pointer;
    padding:6px 4px;
    font-size:12.5px;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .btn-text:hover{color:var(--danger);}

  .summary-row{
    display:flex;
    gap:14px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .summary-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px 18px;
    min-width:130px;
  }
  .summary-num{font-size:22px; font-weight:700; font-family:'Noto Serif TC',serif;}
  .summary-label{color:var(--ink-faint); font-size:12px; margin-top:2px;}

  /* ---------- Gantt ---------- */
  .gantt-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow);
    overflow:hidden;
    margin-bottom:28px;
  }
  .gantt-panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px 10px;
  }
  .gantt-panel-head h3{font-size:15px;}
  .legend{display:flex; gap:14px; font-size:12px; color:var(--ink-faint); align-items:center;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .legend i{width:10px;height:10px;border-radius:2px; display:inline-block;}
  .legend .li-today{background:var(--amber);width:2px;height:12px;border-radius:0;}

  .gantt-scroll{
    overflow-x:auto;
    position:relative;
    padding-bottom:4px;
    cursor:grab;
  }
  .gantt-scroll.dragging{
    cursor:grabbing;
    user-select:none;
  }
  .gantt-header-row, .gantt-row{
    display:flex;
    border-bottom:1px solid var(--border-soft);
  }
  .gantt-header-row{
    position:sticky;
    top:0;
    background:var(--panel);
    z-index:3;
    border-bottom:1px solid var(--border);
  }
  .label-cell{
    width:200px;
    flex:none;
    position:sticky;
    left:0;
    background:var(--panel);
    z-index:2;
    padding:10px 14px;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:2px;
  }
  .label-cell .t-name{font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .label-cell .t-meta{font-size:11px; color:var(--ink-faint);}
  .track-cell{
    position:relative;
    flex:none;
  }
  .month-row .track-cell{height:22px;}
  .day-row .track-cell{height:20px;}
  .month-label{
    position:absolute;
    top:0;left:0;height:100%;
    display:flex; align-items:center;
    padding-left:6px;
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:600;
    border-left:1px solid var(--border);
    box-sizing:border-box;
  }
  .day-tick{
    position:absolute;
    top:0;bottom:0;
    border-left:1px solid var(--border-soft);
  }
  .day-tick.weekend{background:var(--weekend);}
  .day-tick .tick-label{
    position:absolute;
    top:2px; left:4px;
    font-size:10.5px;
    color:var(--ink-faint);
    white-space:nowrap;
  }
  .gantt-row{min-height:44px;}
  .gantt-row:hover{background:#FBFCF9;}
  .gantt-row .track-cell{min-height:44px;}
  .row-bg-tick{
    position:absolute; top:0; bottom:0;
    border-left:1px solid var(--border-soft);
  }
  .row-bg-tick.weekend{background:var(--weekend);}
  .gantt-bar{
    position:absolute;
    top:9px;
    height:26px;
    border-radius:6px;
    background:var(--bar-color, var(--accent));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.06);
    cursor:grab;
    overflow:hidden;
    min-width:6px;
  }
  .gantt-bar.bar-dragging{cursor:grabbing;}
  .bar-handle{
    position:absolute;
    top:0; bottom:0;
    width:7px;
    cursor:ew-resize;
    z-index:2;
  }
  .bar-handle-left{left:0;}
  .bar-handle-right{right:0;}
  .gantt-bar:hover .bar-handle{background:rgba(255,255,255,0.4);}
  .gantt-bar-fill{
    position:absolute;
    left:0;top:0;bottom:0;
    background:rgba(255,255,255,0.35);
    border-right:1px solid rgba(255,255,255,0.55);
  }
  .gantt-bar-label{
    position:absolute;
    left:8px; top:50%; transform:translateY(-50%);
    font-size:11px;
    color:#fff;
    font-weight:600;
    white-space:nowrap;
    text-shadow:0 1px 1px rgba(0,0,0,0.25);
    pointer-events:none;
  }
  .today-line{
    position:absolute;
    top:0; bottom:0;
    width:2px;
    background:var(--amber);
    z-index:1;
  }
  .today-line-tag{
    position:absolute;
    top:-19px;
    left:-14px;
    font-size:10px;
    color:#fff;
    background:var(--amber);
    padding:1px 5px;
    border-radius:3px;
    white-space:nowrap;
  }

  .empty-state{
    padding:60px 20px;
    text-align:center;
    color:var(--ink-faint);
  }
  .empty-state h3{color:var(--ink-soft); font-size:16px; margin-bottom:6px;}
  .empty-state p{margin:0 0 16px; font-size:13px;}

  /* ---------- Task list ---------- */
  .task-list-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .task-list-panel h3{padding:14px 18px 8px; font-size:15px;}
  table{width:100%; border-collapse:collapse;}
  th,td{
    text-align:left;
    padding:10px 18px;
    font-size:13px;
    border-top:1px solid var(--border-soft);
  }
  th{
    color:var(--ink-faint);
    font-weight:500;
    font-size:11.5px;
    letter-spacing:0.02em;
  }
  tr:hover td{background:#FBFCF9;}
  .progress-bar-mini{
    width:90px; height:6px; background:var(--border-soft);
    border-radius:3px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px;
  }
  .progress-bar-mini-fill{height:100%; background:var(--accent); border-radius:3px;}
  .row-actions{display:flex; gap:12px;}
  .row-actions button{
    border:none; background:none; cursor:pointer;
    font-size:12.5px; color:var(--ink-faint); padding:0; text-decoration:underline; text-underline-offset:2px;
  }
  .row-actions button:hover{color:var(--accent-dark);}
  .row-actions button.del:hover{color:var(--danger);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(32,40,30,0.35);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--panel);
    border-radius:var(--radius-md);
    width:100%; max-width:420px;
    padding:24px;
    box-shadow:0 12px 40px rgba(0,0,0,0.18);
  }
  .modal h3{font-size:17px; margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:500;
  }
  .field input[type=text], .field input[type=date], .field select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    font-size:13.5px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
  }
  .field input:focus, .field select:focus{border-color:var(--accent);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .range-row{display:flex; align-items:center; gap:10px;}
  .range-row input[type=range]{flex:1;}
  .range-val{width:38px; text-align:right; font-weight:600; font-size:13px;}
  .color-row{display:flex; gap:8px; margin-top:2px;}
  .color-swatch{
    width:24px;height:24px;border-radius:50%;
    cursor:pointer; border:2px solid transparent;
  }
  .color-swatch.selected{border-color:var(--ink);}
  .modal-actions{
    display:flex; justify-content:flex-end; gap:8px; margin-top:20px;
  }
  .field-error{color:var(--danger); font-size:12px; margin-top:4px; display:none;}

  @media (max-width: 760px){
    #app{flex-direction:column;}
    .sidebar{width:100%; border-right:none; border-bottom:1px solid var(--border); flex-direction:row; flex-wrap:wrap; align-items:center;}
    .sidebar-help{display:none;}
    .main{padding:20px 16px 40px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script>
(function(){
  "use strict";

  /* ===================== 資料層 ===================== */
  var STORAGE_KEY = "ganttMultiProjectApp_v1";
  var PALETTE = ["#2F6F4E","#3B6EA5","#C97E33","#8B5FA8","#B3524A","#4C8073","#9C7A3C"];

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

  function demoState(){
    var today = new Date();
    function d(offset){
      var t = new Date(today);
      t.setDate(t.getDate()+offset);
      return t.toISOString().slice(0,10);
    }
    var p1 = uid(), p2 = uid();
    return {
      currentProjectId: p1,
      projects: [
        { id:p1, name:"新產品上線", color:PALETTE[0] },
        { id:p2, name:"官網改版", color:PALETTE[1] }
      ],
      tasks: [
        { id:uid(), projectId:p1, name:"需求訪談", start:d(-6), end:d(-1), progress:100 },
        { id:uid(), projectId:p1, name:"設計原型", start:d(-2), end:d(5), progress:55 },
        { id:uid(), projectId:p1, name:"開發功能", start:d(3), end:d(14), progress:10 },
        { id:uid(), projectId:p1, name:"測試與驗收", start:d(12), end:d(20), progress:0 },
        { id:uid(), projectId:p2, name:"資料盤點", start:d(-3), end:d(2), progress:70 },
        { id:uid(), projectId:p2, name:"視覺設計", start:d(1), end:d(9), progress:20 }
      ]
    };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return demoState();
      var parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.projects)) return demoState();
      return parsed;
    }catch(e){
      console.error("讀取本機資料失敗，改用範例資料", e);
      return demoState();
    }
  }

  var state = loadState();

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.error("儲存失敗", e);
    }
  }

  function getProject(id){
    for(var i=0;i<state.projects.length;i++) if(state.projects[i].id===id) return state.projects[i];
    return null;
  }
  function tasksOf(projectId){
    return state.tasks.filter(function(t){ return t.projectId===projectId; });
  }

  /* ===================== 工具函式 ===================== */
  function parseDate(s){
    var parts = s.split("-").map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }
  function fmtISO(dt){
    var y=dt.getFullYear(), m=String(dt.getMonth()+1).padStart(2,"0"), d=String(dt.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+d;
  }
  function fmtShort(dt){
    return (dt.getMonth()+1)+"/"+dt.getDate();
  }
  function addDays(dt, n){
    var t = new Date(dt);
    t.setDate(t.getDate()+n);
    return t;
  }
  function dayDiff(a,b){
    return Math.round((b-a)/86400000);
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ===================== 渲染：整體 ===================== */
  var app = document.getElementById("app");

  function render(){
    app.innerHTML = renderSidebar() + renderMain();
    bindEvents();
  }

  function renderSidebar(){
    var items = state.projects.map(function(p){
      var active = p.id === state.currentProjectId ? " active" : "";
      return '<li class="project-item'+active+'" data-action="select-project" data-id="'+p.id+'">'
        + '<span class="project-dot" style="background:'+p.color+'"></span>'
        + '<span class="project-name">'+escapeHtml(p.name)+'</span>'
        + '</li>';
    }).join("");

    return ''
    + '<aside class="sidebar">'
    +   '<div>'
    +     '<h1 class="sidebar-title">甘特圖</h1>'
    +     '<div class="sidebar-sub">同時管理多個專案的時程</div>'
    +   '</div>'
    +   '<ul class="project-list">'+items+'</ul>'
    +   '<button class="add-project-btn" data-action="open-add-project">+ 新增專案</button>'
    +   '<div class="sidebar-help">'
    +     '點選左側專案即可切換。<br>'
    +     '每個專案的任務會顯示成時間軸上的長條，長條愈滿代表進度愈高。<br>'
    +     '資料會自動儲存在這台電腦的瀏覽器中。'
    +   '</div>'
    + '</aside>';
  }

  function renderMain(){
    var project = getProject(state.currentProjectId);
    if(!project){
      return '<main class="main"><div class="empty-state"><h3>還沒有任何專案</h3>'
        + '<p>建立第一個專案，開始規劃時程。</p>'
        + '<button class="btn btn-primary" data-action="open-add-project">+ 新增專案</button>'
        + '</div></main>';
    }
    var tasks = tasksOf(project.id);
    var completedCount = tasks.filter(function(t){return t.progress>=100;}).length;
    var avgProgress = tasks.length ? Math.round(tasks.reduce(function(s,t){return s+t.progress;},0)/tasks.length) : 0;

    var rangeText = "";
    if(tasks.length){
      var starts = tasks.map(function(t){return parseDate(t.start);});
      var ends = tasks.map(function(t){return parseDate(t.end);});
      var minS = new Date(Math.min.apply(null, starts));
      var maxE = new Date(Math.max.apply(null, ends));
      rangeText = fmtShort(minS)+" – "+fmtShort(maxE);
    }

    return ''
    + '<main class="main">'
    +   '<div class="main-header">'
    +     '<div class="main-header-left">'
    +       '<span class="main-dot" style="background:'+project.color+'"></span>'
    +       '<div>'
    +         '<h2 class="main-title">'+escapeHtml(project.name)+'</h2>'
    +         '<div class="main-meta">'+(rangeText ? "時程範圍："+rangeText : "尚未安排時程")+'</div>'
    +       '</div>'
    +     '</div>'
    +     '<div class="header-actions">'
    +       '<button class="btn" data-action="rename-project">重新命名</button>'
    +       '<button class="btn" data-action="delete-project">刪除專案</button>'
    +       '<button class="btn btn-primary" data-action="open-add-task">+ 新增任務</button>'
    +     '</div>'
    +   '</div>'

    +   '<div class="summary-row">'
    +     '<div class="summary-card"><div class="summary-num">'+tasks.length+'</div><div class="summary-label">任務總數</div></div>'
    +     '<div class="summary-card"><div class="summary-num">'+completedCount+'</div><div class="summary-label">已完成</div></div>'
    +     '<div class="summary-card"><div class="summary-num">'+avgProgress+'%</div><div class="summary-label">平均進度</div></div>'
    +   '</div>'

    +   renderGanttPanel(project, tasks)
    +   renderTaskListPanel(project, tasks)
    + '</main>';
  }

  var currentGanttMeta = null; // { projectId, minS, dayWidth } — used by task-bar dragging

  function renderGanttPanel(project, tasks){
    if(!tasks.length){
      currentGanttMeta = null;
      return '<div class="gantt-panel"><div class="empty-state">'
        + '<h3>這個專案還沒有任務</h3>'
        + '<p>新增第一個任務，開始畫出時間軸。</p>'
        + '<button class="btn btn-primary" data-action="open-add-task">+ 新增任務</button>'
        + '</div></div>';
    }

    var starts = tasks.map(function(t){return parseDate(t.start);});
    var ends = tasks.map(function(t){return parseDate(t.end);});
    var minS = new Date(Math.min.apply(null, starts));
    var maxE = new Date(Math.max.apply(null, ends));
    // padding
    minS = addDays(minS, -2);
    maxE = addDays(maxE, 2);
    var totalDays = Math.max(dayDiff(minS, maxE), 7);

    var dayWidth = totalDays<=31 ? 40 : totalDays<=62 ? 28 : totalDays<=120 ? 16 : 9;
    var totalWidth = totalDays*dayWidth;
    currentGanttMeta = { projectId: project.id, minS: minS, dayWidth: dayWidth };

    var today = new Date(); today.setHours(0,0,0,0);
    var todayOffset = dayDiff(minS, today);
    var showToday = todayOffset>=0 && todayOffset<=totalDays;

    // month row
    var monthLabels = "";
    var cursor = 0;
    while(cursor < totalDays){
      var dt = addDays(minS, cursor);
      var nextMonth = new Date(dt.getFullYear(), dt.getMonth()+1, 1);
      var daysInSpan = Math.min(dayDiff(dt, nextMonth), totalDays-cursor);
      monthLabels += '<div class="month-label" style="left:'+(cursor*dayWidth)+'px;width:'+(daysInSpan*dayWidth)+'px;">'
        + (dt.getMonth()+1)+'月</div>';
      cursor += daysInSpan;
    }

    // day ticks (header)
    var dayTicks = "";
    var rowTicks = "";
    for(var i=0;i<totalDays;i++){
      var dtd = addDays(minS, i);
      var isWeekend = dtd.getDay()===0 || dtd.getDay()===6;
      var isMonday = dtd.getDay()===1;
      var isFirst = dtd.getDate()===1;
      var left = i*dayWidth;
      dayTicks += '<div class="day-tick'+(isWeekend?" weekend":"")+'" style="left:'+left+'px;width:'+dayWidth+'px;">'
        + ((isMonday||isFirst) ? '<span class="tick-label">'+fmtShort(dtd)+'</span>' : '')
        + '</div>';
      rowTicks += '<div class="row-bg-tick'+(isWeekend?" weekend":"")+'" style="left:'+left+'px;width:'+dayWidth+'px;"></div>';
    }

    var todayLineHtml = showToday
      ? '<div class="today-line" style="left:'+(200+todayOffset*dayWidth)+'px;"><span class="today-line-tag">今天</span></div>'
      : '';

    var rows = tasks.map(function(t){
      var s = parseDate(t.start), e = parseDate(t.end);
      var offset = dayDiff(minS, s);
      var span = Math.max(dayDiff(s, e)+1, 1);
      var barLeft = offset*dayWidth;
      var barWidth = Math.max(span*dayWidth - 3, 8);
      return ''
      + '<div class="gantt-row" data-id="'+t.id+'">'
      +   '<div class="label-cell">'
      +     '<div class="t-name">'+escapeHtml(t.name)+'</div>'
      +     '<div class="t-meta">'+fmtShort(s)+' – '+fmtShort(e)+' · '+t.progress+'%</div>'
      +   '</div>'
      +   '<div class="track-cell" style="width:'+totalWidth+'px;">'
      +     rowTicks
      +     '<div class="gantt-bar" style="--bar-color:'+project.color+'; left:'+barLeft+'px; width:'+barWidth+'px;" data-action="edit-task" data-id="'+t.id+'" title="拖動中間移動時間、拖動左右邊緣調整長度，點一下編輯任務">'
      +       '<div class="bar-handle bar-handle-left" data-role="resize-left"></div>'
      +       '<div class="gantt-bar-fill" style="width:'+t.progress+'%"></div>'
      +       (barWidth>50 ? '<span class="gantt-bar-label">'+escapeHtml(t.name)+'</span>' : '')
      +       '<div class="bar-handle bar-handle-right" data-role="resize-right"></div>'
      +     '</div>'
      +   '</div>'
      + '</div>';
    }).join("");

    return ''
    + '<div class="gantt-panel">'
    +   '<div class="gantt-panel-head">'
    +     '<h3>時間軸</h3>'
    +     '<div class="legend">'
    +       '<span><i style="background:'+project.color+'"></i>任務進度</span>'
    +       '<span><i class="li-today"></i>今天</span>'
    +     '</div>'
    +   '</div>'
    +   '<div class="gantt-scroll">'
    +     '<div class="gantt-header-row month-row">'
    +       '<div class="label-cell"></div>'
    +       '<div class="track-cell" style="width:'+totalWidth+'px;">'+monthLabels+'</div>'
    +     '</div>'
    +     '<div class="gantt-header-row day-row">'
    +       '<div class="label-cell" style="font-size:11.5px;color:var(--ink-faint);display:flex;align-items:center;">任務</div>'
    +       '<div class="track-cell" style="width:'+totalWidth+'px;">'+dayTicks+'</div>'
    +     '</div>'
    +     rows
    +     todayLineHtml
    +   '</div>'
    + '</div>';
  }

  function renderTaskListPanel(project, tasks){
    if(!tasks.length) return "";
    var rows = tasks.map(function(t){
      return ''
      + '<tr>'
      +   '<td>'+escapeHtml(t.name)+'</td>'
      +   '<td>'+t.start+' ~ '+t.end+'</td>'
      +   '<td><span class="progress-bar-mini"><span class="progress-bar-mini-fill" style="width:'+t.progress+'%;background:'+project.color+'"></span></span>'+t.progress+'%</td>'
      +   '<td><div class="row-actions">'
      +     '<button data-action="edit-task" data-id="'+t.id+'">編輯</button>'
      +     '<button class="del" data-action="delete-task" data-id="'+t.id+'">刪除</button>'
      +   '</div></td>'
      + '</tr>';
    }).join("");

    return ''
    + '<div class="task-list-panel">'
    +   '<h3>任務清單</h3>'
    +   '<table>'
    +     '<thead><tr><th>任務名稱</th><th>日期</th><th>進度</th><th></th></tr></thead>'
    +     '<tbody>'+rows+'</tbody>'
    +   '</table>'
    + '</div>';
  }

  /* ===================== 事件綁定 ===================== */
  function bindEvents(){
    app.querySelectorAll('[data-action]').forEach(function(el){
      el.addEventListener('click', function(){
        var action = el.getAttribute('data-action');
        var id = el.getAttribute('data-id');
        handleAction(action, id);
      });
    });
  }

  function handleAction(action, id){
    switch(action){
      case "select-project":
        state.currentProjectId = id;
        saveState(); render();
        break;
      case "open-add-project":
        openProjectModal(null);
        break;
      case "rename-project":
        openProjectModal(getProject(state.currentProjectId));
        break;
      case "delete-project":
        confirmDeleteProject();
        break;
      case "open-add-task":
        openTaskModal(null);
        break;
      case "edit-task":
        openTaskModal(state.tasks.find(function(t){return t.id===id;}));
        break;
      case "delete-task":
        if(confirm("確定要刪除這個任務嗎？")){
          state.tasks = state.tasks.filter(function(t){return t.id!==id;});
          saveState(); render();
        }
        break;
    }
  }

  /* ===================== Modal：專案 ===================== */
  var modalRoot = document.getElementById("modal-root");

  function closeModal(){ modalRoot.innerHTML = ""; }

  function openProjectModal(editing){
    var isEdit = !!editing;
    var colorSwatches = PALETTE.map(function(c){
      var sel = (editing ? editing.color===c : c===PALETTE[0]) ? " selected" : "";
      return '<span class="color-swatch'+sel+'" style="background:'+c+'" data-color="'+c+'"></span>';
    }).join("");

    modalRoot.innerHTML = ''
    + '<div class="modal-overlay" id="overlay">'
    +   '<div class="modal">'
    +     '<h3>'+(isEdit ? "重新命名專案" : "新增專案")+'</h3>'
    +     '<div class="field">'
    +       '<label for="proj-name">專案名稱</label>'
    +       '<input type="text" id="proj-name" value="'+(editing?escapeHtml(editing.name):"")+'" placeholder="例如：新產品上線">'
    +       '<div class="field-error" id="proj-name-err">請輸入專案名稱</div>'
    +     '</div>'
    +     '<div class="field">'
    +       '<label>顏色</label>'
    +       '<div class="color-row" id="color-row">'+colorSwatches+'</div>'
    +     '</div>'
    +     '<div class="modal-actions">'
    +       '<button class="btn" id="cancel-btn">取消</button>'
    +       '<button class="btn btn-primary" id="save-btn">'+(isEdit?"儲存":"建立專案")+'</button>'
    +     '</div>'
    +   '</div>'
    + '</div>';

    var selectedColor = editing ? editing.color : PALETTE[0];
    modalRoot.querySelectorAll('.color-swatch').forEach(function(sw){
      sw.addEventListener('click', function(){
        modalRoot.querySelectorAll('.color-swatch').forEach(function(s){s.classList.remove('selected');});
        sw.classList.add('selected');
        selectedColor = sw.getAttribute('data-color');
      });
    });

    document.getElementById('overlay').addEventListener('click', function(e){
      if(e.target.id === 'overlay') closeModal();
    });
    document.getElementById('cancel-btn').addEventListener('click', closeModal);
    document.getElementById('save-btn').addEventListener('click', function(){
      var nameInput = document.getElementById('proj-name');
      var name = nameInput.value.trim();
      if(!name){
        document.getElementById('proj-name-err').style.display = 'block';
        return;
      }
      if(isEdit){
        editing.name = name;
        editing.color = selectedColor;
      } else {
        var np = { id: uid(), name: name, color: selectedColor };
        state.projects.push(np);
        state.currentProjectId = np.id;
      }
      saveState();
      closeModal();
      render();
    });
  }

  function confirmDeleteProject(){
    var project = getProject(state.currentProjectId);
    if(!project) return;
    var count = tasksOf(project.id).length;
    var msg = count>0
      ? '確定要刪除「'+project.name+'」嗎？這會一併刪除其中的 '+count+' 個任務，無法復原。'
      : '確定要刪除「'+project.name+'」嗎？';
    if(!confirm(msg)) return;
    state.tasks = state.tasks.filter(function(t){return t.projectId!==project.id;});
    state.projects = state.projects.filter(function(p){return p.id!==project.id;});
    state.currentProjectId = state.projects.length ? state.projects[0].id : null;
    saveState(); render();
  }

  /* ===================== Modal：任務 ===================== */
  function openTaskModal(editing){
    var isEdit = !!editing;
    var today = fmtISO(new Date());
    var start = editing ? editing.start : today;
    var end = editing ? editing.end : fmtISO(addDays(new Date(),5));
    var progress = editing ? editing.progress : 0;

    modalRoot.innerHTML = ''
    + '<div class="modal-overlay" id="overlay">'
    +   '<div class="modal">'
    +     '<h3>'+(isEdit ? "編輯任務" : "新增任務")+'</h3>'
    +     '<div class="field">'
    +       '<label for="task-name">任務名稱</label>'
    +       '<input type="text" id="task-name" value="'+(editing?escapeHtml(editing.name):"")+'" placeholder="例如：設計原型">'
    +       '<div class="field-error" id="task-name-err">請輸入任務名稱</div>'
    +     '</div>'
    +     '<div class="field-row">'
    +       '<div class="field"><label for="task-start">開始日期</label><input type="date" id="task-start" value="'+start+'"></div>'
    +       '<div class="field"><label for="task-end">結束日期</label><input type="date" id="task-end" value="'+end+'"></div>'
    +     '</div>'
    +     '<div class="field-error" id="task-date-err">結束日期不可早於開始日期</div>'
    +     '<div class="field">'
    +       '<label for="task-progress">進度</label>'
    +       '<div class="range-row">'
    +         '<input type="range" id="task-progress" min="0" max="100" step="5" value="'+progress+'">'
    +         '<span class="range-val" id="progress-val">'+progress+'%</span>'
    +       '</div>'
    +     '</div>'
    +     '<div class="modal-actions">'
    +       (isEdit ? '<button class="btn" id="delete-task-btn" style="margin-right:auto;color:var(--danger);border-color:var(--danger-soft);">刪除任務</button>' : '')
    +       '<button class="btn" id="cancel-btn">取消</button>'
    +       '<button class="btn btn-primary" id="save-btn">'+(isEdit?"儲存":"新增")+'</button>'
    +     '</div>'
    +   '</div>'
    + '</div>';

    var rangeInput = document.getElementById('task-progress');
    rangeInput.addEventListener('input', function(){
      document.getElementById('progress-val').textContent = rangeInput.value+'%';
    });

    document.getElementById('overlay').addEventListener('click', function(e){
      if(e.target.id === 'overlay') closeModal();
    });
    document.getElementById('cancel-btn').addEventListener('click', closeModal);

    if(isEdit){
      document.getElementById('delete-task-btn').addEventListener('click', function(){
        if(confirm("確定要刪除這個任務嗎？")){
          state.tasks = state.tasks.filter(function(t){return t.id!==editing.id;});
          saveState(); closeModal(); render();
        }
      });
    }

    document.getElementById('save-btn').addEventListener('click', function(){
      var name = document.getElementById('task-name').value.trim();
      var s = document.getElementById('task-start').value;
      var e = document.getElementById('task-end').value;
      var p = Number(rangeInput.value);

      document.getElementById('task-name-err').style.display = 'none';
      document.getElementById('task-date-err').style.display = 'none';

      var hasError = false;
      if(!name){ document.getElementById('task-name-err').style.display='block'; hasError = true; }
      if(!s || !e || e < s){ document.getElementById('task-date-err').style.display='block'; hasError = true; }
      if(hasError) return;

      if(isEdit){
        editing.name = name; editing.start = s; editing.end = e; editing.progress = p;
      } else {
        state.tasks.push({ id: uid(), projectId: state.currentProjectId, name:name, start:s, end:e, progress:p });
      }
      saveState();
      closeModal();
      render();
    });
  }

  /* ===================== 時間軸拖拉捲動 ===================== */
  var dragState = { active:false, el:null, startX:0, startScroll:0, moved:false };
  var suppressClick = false;

  document.addEventListener('mousedown', function(e){
    var scroller = e.target.closest && e.target.closest('.gantt-scroll');
    if(!scroller) return;
    if(e.target.closest && e.target.closest('.gantt-bar')) return; // 交給任務長條拖曳處理
    dragState.active = true;
    dragState.el = scroller;
    dragState.startX = e.pageX;
    dragState.startScroll = scroller.scrollLeft;
    dragState.moved = false;
    scroller.classList.add('dragging');
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e){
    if(!dragState.active) return;
    var dx = e.pageX - dragState.startX;
    if(Math.abs(dx) > 3){
      dragState.moved = true;
      suppressClick = true;
    }
    if(dragState.moved){
      dragState.el.scrollLeft = dragState.startScroll - dx;
    }
  });

  function endDrag(){
    if(dragState.active){
      dragState.active = false;
      if(dragState.el) dragState.el.classList.remove('dragging');
      dragState.el = null;
    }
  }
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('mouseleave', endDrag);

  /* ---- 拖曳任務長條：移動整條、或拖左右邊緣調整長度 ---- */
  var barDrag = { active:false, mode:null, task:null, barEl:null, metaEl:null,
    startX:0, origStart:null, origEnd:null, newStart:null, newEnd:null };

  document.addEventListener('mousedown', function(e){
    var barEl = e.target.closest && e.target.closest('.gantt-bar');
    if(!barEl || !currentGanttMeta) return;
    var taskId = barEl.getAttribute('data-id');
    var task = state.tasks.find(function(t){ return t.id===taskId; });
    if(!task) return;

    var mode = 'move';
    if(e.target.closest('.bar-handle-left')) mode = 'resize-left';
    else if(e.target.closest('.bar-handle-right')) mode = 'resize-right';

    barDrag.active = true;
    barDrag.mode = mode;
    barDrag.task = task;
    barDrag.barEl = barEl;
    var rowEl = barEl.closest('.gantt-row');
    barDrag.metaEl = rowEl ? rowEl.querySelector('.t-meta') : null;
    barDrag.startX = e.pageX;
    barDrag.origStart = parseDate(task.start);
    barDrag.origEnd = parseDate(task.end);
    barDrag.newStart = barDrag.origStart;
    barDrag.newEnd = barDrag.origEnd;

    barEl.classList.add('bar-dragging');
    document.body.style.cursor = (mode==='move') ? 'grabbing' : 'ew-resize';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e){
    if(!barDrag.active) return;
    var dx = e.pageX - barDrag.startX;
    if(Math.abs(dx) > 3) suppressClick = true;

    var dayWidth = currentGanttMeta.dayWidth;
    var dayDelta = Math.round(dx / dayWidth);
    var newStart = barDrag.origStart, newEnd = barDrag.origEnd;

    if(barDrag.mode === 'move'){
      newStart = addDays(barDrag.origStart, dayDelta);
      newEnd = addDays(barDrag.origEnd, dayDelta);
    } else if(barDrag.mode === 'resize-left'){
      newStart = addDays(barDrag.origStart, dayDelta);
      if(newStart > barDrag.origEnd) newStart = barDrag.origEnd;
    } else if(barDrag.mode === 'resize-right'){
      newEnd = addDays(barDrag.origEnd, dayDelta);
      if(newEnd < barDrag.origStart) newEnd = barDrag.origStart;
    }

    barDrag.newStart = newStart;
    barDrag.newEnd = newEnd;

    var offset = dayDiff(currentGanttMeta.minS, newStart);
    var span = Math.max(dayDiff(newStart, newEnd)+1, 1);
    barDrag.barEl.style.left = (offset*dayWidth)+'px';
    barDrag.barEl.style.width = Math.max(span*dayWidth-3, 8)+'px';
    if(barDrag.metaEl){
      barDrag.metaEl.textContent = fmtShort(newStart)+' – '+fmtShort(newEnd)+' · '+barDrag.task.progress+'%';
    }
  });

  function endBarDrag(){
    if(!barDrag.active) return;
    if(barDrag.barEl) barDrag.barEl.classList.remove('bar-dragging');
    document.body.style.cursor = '';
    if(barDrag.newStart && barDrag.newEnd &&
       (fmtISO(barDrag.newStart)!==barDrag.task.start || fmtISO(barDrag.newEnd)!==barDrag.task.end)){
      barDrag.task.start = fmtISO(barDrag.newStart);
      barDrag.task.end = fmtISO(barDrag.newEnd);
      saveState();
      render();
    }
    barDrag.active = false;
    barDrag.task = null;
    barDrag.barEl = null;
    barDrag.metaEl = null;
  }
  document.addEventListener('mouseup', endBarDrag);
  document.addEventListener('mouseleave', endBarDrag);

  // 拖拉放開後，攔截接下來那一次 click，避免誤觸長條上的編輯功能
  document.addEventListener('click', function(e){
    if(suppressClick){
      suppressClick = false;
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);

  /* ===================== 啟動 ===================== */
  if(!state.currentProjectId && state.projects.length){
    state.currentProjectId = state.projects[0].id;
  }
  render();
})();
</script>
</body>
</html>
